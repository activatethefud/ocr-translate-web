name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Run live API tests (spends money; needs DS_KEY secret)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps (TeX Live + fonts + poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            texlive-xetex texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            fonts-noto-core fonts-noto-cjk

      - name: Install
        run: pip install -e "./backend[dev,server]"

      - name: Lint (ruff)
        run: |
          ruff check backend
          ruff format --check backend

      - name: Tests (unit + integration, no network)
        working-directory: backend
        run: PYTHONPATH=. pytest -q

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  live:
    name: live API test (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.live == 'true'
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils texlive-xetex texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended fonts-noto-core
      - run: pip install -e "./backend[dev,server]"
      - name: Live test (spends a little money)
        working-directory: backend
        env:
          OCRtran_LIVE: "1"
          DS_KEY: ${{ secrets.DS_KEY }}
        run: |
          if [ -z "$DS_KEY" ]; then echo "no DS_KEY secret configured"; exit 0; fi
          PYTHONPATH=. pytest -m live -q
