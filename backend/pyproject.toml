[project]
name = "ocrtran"
version = "0.1.0"
description = "Vision-model OCR + translation pipeline (engine for ocr-translate-web)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pymupdf>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
server = [
    "fastapi>=0.115,<0.116",
    "starlette>=0.40,<0.42",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2",
    "sqlalchemy>=2",
    "python-multipart>=0.0.9",
    "pikepdf>=9",
    "httpx>=0.27",
]

[project.scripts]
ocrtran = "ocrtran.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ocrtran*", "app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs system tools (xelatex, pymupdf rendering)",
    "live: needs a real API key (network + cost)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]
