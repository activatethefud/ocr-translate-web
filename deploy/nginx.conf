# Edge reverse proxy with connection + request limits and SSE-friendly streaming.
# Point your TLS terminator (or this nginx with certs) at the `api` service.
worker_processes 1;
events { worker_connections 1024; }

http {
    # per-IP: 10 req/s (burst 20) and 20 concurrent connections
    limit_req_zone  $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    server {
        listen 80;
        client_max_body_size 250m;          # upload cap
        proxy_read_timeout 3600s;           # long SSE / jobs
        proxy_send_timeout 3600s;

        location / {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn 20;

            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;            # required for SSE (/api/jobs/*/events)
            proxy_cache off;
        }
    }
}
